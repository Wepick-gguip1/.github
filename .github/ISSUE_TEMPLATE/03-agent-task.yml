name: Agent task
description: AI 에이전트가 독립적으로 수행할 수 있는 범위가 명확한 작업을 정의합니다.
title: "[Agent]: "
body:
  - type: textarea
    id: objective
    attributes:
      label: 목표
      description: 에이전트가 달성해야 할 한 가지 구체적인 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 배경과 참고 자료
      description: 관련 코드, 문서, Issue와 제약 조건을 연결해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 수정 가능한 영역과 명시적으로 제외할 영역을 적어 주세요.
      placeholder: |
        포함:
        - ...

        제외:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 테스트와 리뷰가 가능한 조건을 체크리스트로 적어 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 필수 검증
      description: 에이전트가 실행해야 하는 테스트와 확인 명령을 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: 위험도
      options:
        - Low - 문서, 테스트 또는 국소적 변경
        - Medium - 사용자 동작이나 내부 구조 변경
        - High - 보안, 데이터, 인프라 또는 배포 변경
    validations:
      required: true
  - type: checkboxes
    id: approval
    attributes:
      label: 권한 확인
      options:
        - label: 이 작업은 에이전트에게 조직 관리자 권한이나 Secret 접근을 요구하지 않습니다.
          required: true
        - label: 운영 배포가 필요하면 사람이 별도로 승인합니다.
          required: true
