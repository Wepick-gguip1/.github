name: Bug report
description: 재현 가능한 문제나 회귀를 제보합니다.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        제보 전에 기존 Issue와 최신 버전에서도 문제가 발생하는지 확인해 주세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 기대한 동작과 실제 동작을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 최소한의 재현 단계, 입력값 또는 예제 코드를 적어 주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저, 런타임과 관련 버전을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 로그 및 추가 자료
      description: 민감정보를 제거한 로그, 화면 또는 참고 링크를 첨부해 주세요.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 공개하면 안 되는 Secret과 개인정보를 제거했습니다.
          required: true
