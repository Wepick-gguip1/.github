name: Feature request
description: 새로운 기능이나 개선 아이디어를 제안합니다.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능보다 먼저 사용자 또는 운영상의 문제를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작과 범위를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 해결 방법이나 현재의 우회 방법이 있다면 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 구현 완료를 판단할 수 있는 검증 가능한 조건을 적어 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
